# Vstavi v VirtualHost *:443 za noc.dezman.net (pred zaključni </VirtualHost>):
#   sudo a2enmod proxy proxy_wstunnel && sudo systemctl reload apache2
# NOC – terminal routerjev (WebSocket most na 127.0.0.1:8765)
ProxyPass        /term/ws ws://127.0.0.1:8765/term/ws
ProxyPassReverse /term/ws ws://127.0.0.1:8765/term/ws
